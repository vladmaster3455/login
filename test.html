<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Labo du Codeur Fou</title>
    <link rel="stylesheet" href="test.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div id="login-screen" class="login-container">
        <div class="login-card">
            <h1>Login Codeur</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="email-login">Email</label>
                    <input type="email" id="email-login" placeholder="exemple@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="password-login">Mot de passe</label>
                    <div class="password-container">
                        <input type="password" id="password-login" required>
                        <!-- <i class="fa-solid fa-eye show-password" id="show-password-login"></i> -->
                    </div>
                </div>
                <button type="submit" class="bouton-sasuke">Démarrer le système !</button>
                <p id="error-message-global"></p>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden">
        <header class="header-otaku">
            <h1 class="titre-senpai">Bienvenue, Admin <i class="fa-solid fa-hand-wave"></i></h1>
        </header>

        <main class="main-content">
            <section class="section-creer-compte">
                <h2>Créer un nouveau profil </h2>
                <form id="create-account-form">
                    <div class="form-group">
                        <label for="nom-compte">Nom</label>
                        <input type="text" id="nom-compte" required>
                        <span class="error-message" id="error-nom-compte"></span>
                    </div>
                    <div class="form-group">
                        <label for="prenom-compte">Prénom</label>
                        <input type="text" id="prenom-compte" required>
                        <span class="error-message" id="error-prenom-compte"></span>
                    </div>
                    <div class="form-group">
                        <label for="email-compte">Email</label>
                        <input type="email" id="email-compte" required>
                        <span class="error-message" id="error-email-compte"></span>
                    </div>
                    <div class="form-group">
                        <label for="password-compte">Mot de passe</label>
                        <div class="password-container">
                            <input type="password" id="password-compte" required>
                            <i class="fa-solid fa-eye show-password" id="show-password-create"></i>
                        </div>
                        <span class="error-message" id="error-password-compte"></span>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password-compte">Confirmer le mot de passe</label>
                        <div class="password-container">
                            <input type="password" id="confirm-password-compte" required>
                            <i class="fa-solid fa-eye show-password" id="show-password-confirm"></i>
                        </div>
                        <span class="error-message" id="error-confirm-password-compte"></span>
                    </div>
                    <button type="submit" class="bouton-creer-compte">Créer le profil</button>
                </form>
            </section>

            <section class="section-liste-nakama">
                <h2>Liste des Profils </h2>
                <table id="nakama-table">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Email</th>
                            <th>Date de création</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="test.js"></script>
</body>
</html>
